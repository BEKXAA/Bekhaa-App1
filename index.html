<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bekhaa App</title>
<meta name="theme-color" content="#0e1118">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bekhaa">
<meta name="format-detection" content="telephone=no">
<style>:root{--bg:#0e1118;--card:rgba(20,25,38,.78);--b:rgba(120,135,170,.28);--tx:#e8ecf5;--mu:#8a94ad;--ac:#ff6a2b;--ac2:#4f8cff;--ok:#2ecc71;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}body{color:var(--tx);font-size:15px}
a{color:var(--ac2)}header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--b);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:20px;color:var(--ac)}.sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}
nav button{white-space:nowrap}main{padding:12px;max-width:1000px;margin:auto}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--b);border-radius:10px;padding:9px 12px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button.on{background:var(--ac2);border-color:var(--ac2);color:#fff}button.d{color:#ff5d5d}
input,select,textarea{width:100%;margin:4px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px}
.card img,.ph{width:100%;height:130px;object-fit:cover;border-radius:10px;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:48px}
.pr{color:var(--ac);font-weight:700}.mu{color:var(--mu);font-size:13px}.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--b)}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--b);display:inline-flex;align-items:center;justify-content:center;font-size:20px}
#auth{max-width:380px;margin:8vh auto;padding:16px}.badge{background:var(--ac);color:#fff;border-radius:20px;padding:0 7px;font-size:12px}
.msgs{height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--card);border:1px solid var(--b);border-radius:14px}
.m{max-width:80%;padding:7px 11px;border-radius:12px;background:var(--b)}.m.me{align-self:flex-end;background:var(--ac2);color:#fff}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}#modal>div{background:var(--card);border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
h2{margin:14px 0 8px}.t{font-size:12px;color:var(--ac2)}
#tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:99}

function localDB(){
 const K='bk_db',L=new Set();let D;try{D=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){D={}}
 const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Xotira to\'ldi')}L.forEach(f=>f())};
 window.addEventListener('storage',e=>{if(e.key===K){try{D=JSON.parse(e.newValue||'{}')}catch(_){}L.forEach(f=>f())}});
 const cp=x=>JSON.parse(JSON.stringify(x));
 const snap=(id,d)=>({id,exists:d!==undefined,data:()=>d===undefined?undefined:cp(d),metadata:{}});
 const ref=(c,id)=>({id,get:async()=>snap(id,(D[c]||{})[id]),set:async d=>{(D[c]=D[c]||{})[id]=cp(d);save()},update:async d=>{const o=(D[c]||{})[id];if(o){Object.assign(o,cp(d));save()}},delete:async()=>{if(D[c]){delete D[c][id];save()}}});
 const query=(c,o)=>({orderBy:(f,dir)=>query(c,{...o,f,dir}),limit:n=>query(c,{...o,n}),
  _docs(){let a=Object.entries(D[c]||{});if(o.f)a.sort((x,y)=>(x[1][o.f]>y[1][o.f]?1:-1)*(o.dir==='desc'?-1:1));if(o.n)a=a.slice(0,o.n);return a.map(([i,d])=>snap(i,d))},
  get(){const docs=this._docs();return Promise.resolve({docs,size:docs.length,empty:!docs.length})},
  onSnapshot(fn){const run=()=>{const docs=this._docs();fn({docs,size:docs.length,empty:!docs.length})};L.add(run);setTimeout(run,0);return()=>L.delete(run)}});
 return{doc:p=>{const[c,id]=p.split('/');return ref(c,id)},collection:c=>({...query(c,{}),doc:id=>ref(c,id||Math.random().toString(36).slice(2)),add:async d=>{const r=ref(c,Date.now().toString(36)+Math.random().toString(36).slice(2,6));await r.set(d);return r}})}
}

 db.collection('users').onSnapshot(s=>{S.loaded=1;S.users={};s.docs.forEach(d=>S.users[d.id]=d.data());render()});
 db.collection('cfg').onSnapshot(s=>{S.cfg={};s.docs.forEach(d=>S.cfg[d.id]=d.data().img);render()});
 db.collection('items').onSnapshot(s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t);render()});
 db.collection('chat').orderBy('t','desc').limit(150).onSnapshot(s=>{S.chat=s.docs.map(d=>d.data()).reverse();if(tab==='chat')render(true)});
 db.collection('reports').onSnapshot(s=>{S.reports=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.t-b.t);render()});
 db.collection('notifs').onSnapshot(s=>{S.notifs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t);render()});
 try{me=localStorage.getItem('bk_me')}catch(e){}
 render();
}
const ready=()=>me&&S.users[me];
function authView(reg){
 $('#app').innerHTML=`<div id="auth" class="card"><div class="logo">Bekhaa App</div><h2>${reg?'Profil yaratish':'Kirish'}</h2>
 ${reg?'<input id="em" type="email" placeholder="Email">':''}<input id="lg" placeholder="Login" autocapitalize="none"><input id="pw" type="password" placeholder="Parol">
 <button class="p" style="width:100%;margin-top:8px" onclick="${reg?'doReg()':'doLogin()'}">${reg?'Yaratish':'Kirish'}</button>
 <p class="mu" style="text-align:center">${reg?'Profil bormi? <a href="#" onclick="authView(0);return false">Kirish</a>':'<a href="#" onclick="authView(1);return false">Yaratish</a>'}</p></div>`}
async function doLogin(){const l=$('#lg').value.trim().toLowerCase(),p=$('#pw').value;if(!l||!p)return toast('Login va parolni kiriting');
 if(l==='admin123'&&p==='admin123'&&!(await db.doc('users/admin123').get()).exists)await db.doc('users/admin123').set({email:'admin@bekhaa.app',pass:await hash(l+p),nick:'Admin',bio:'',av:'',coins:99999,inv:[],titles:['Admin'],title:'Admin',admin:true,bonus:0});
 const d=await db.doc('users/'+l).get();if(!d.exists||d.data().pass!==await hash(l+p))return toast('Login yoki parol xato');
 me=l;try{localStorage.setItem('bk_me',l)}catch(e){}render()}
async function doReg(){const l=$('#lg').value.trim().toLowerCase(),p=$('#pw').value,e=$('#em').value.trim();
 if(!/^[a-z0-9_]{3,20}$/.test(l))return toast('Login: 3-20 ta harf/raqam/_');if(p.length<4||!e.includes('@'))return toast('Email va parol (4+) kiriting');
 if((await db.doc('users/'+l).get()).exists)return toast('Bu login band');
 const first=Object.keys(S.users).length===0;
 await db.doc('users/'+l).set({email:e,pass:await hash(l+p),nick:l,bio:'',av:'',coins:1000,inv:[],titles:first?['Admin']:[],title:first?'Admin':'',admin:first,bonus:0});
 me=l;try{localStorage.setItem('bk_me',l)}catch(e){}render()}
function logout(){me=null;try{localStorage.removeItem('bk_me')}catch(e){}authView(0)}
async function upd(d){await db.doc('users/'+me).update(d)}
async function notify(to,text){await db.collection('notifs').add({to,text,t:Date.now()})}

const TABS=[['shop','🛒 Magazin'],['cs2','CS2'],['so2','SO2'],['case','📦 Case'],['coin','🪙 Coin'],['inv','🎒 Inventar'],['chat','💬 Chat'],['report','🛟 Report'],['notif','🔔'],['me','👤 Profil']];
function render(keep){
 if(!db)return;if(!ready()){if(me&&!S.loaded)return;if(me){me=null;try{localStorage.removeItem('bk_me')}catch(e){}}return authView(0)}
 if(keep&&tab==='chat'&&$('#cm')){return chatMsgs()}
 const nn=S.notifs.filter(n=>n.to===me&&!n.r).length,u=U(me),a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.id!=='sq')return;
 $('#app').innerHTML=`<header><span class="logo">Bekhaa App</span><span class="sp"></span><b>🪙 ${Math.floor(u.coins||0)}</b>${avt(me)}</header>
 <nav>${(u.admin?[...TABS,['admin','🛡 Admin']]:TABS).map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${n}${k==='notif'&&nn?` <span class="badge">${nn}</span>`:''}</button>`).join('')}</nav><main>${V[tab]()}</main>`;
 if(tab==='chat')chatMsgs();
}
const itemCard=i=>`<div class="card"><img src="${i.img||art(i.kind,'#4f8cff')}">
 <div class="row" style="margin-top:6px"><b>${esc(i.name)}</b></div><div class="row"><span class="tag">${i.game}</span><span class="tag">${KIND[i.kind]}</span><span class="pr">${esc(i.price)} 🪙</span></div>
 <p class="mu">${esc(i.bio)}</p><div class="mu">${avt(i.seller).replace('class="av"','class="av" style="width:24px;height:24px;font-size:12px"')} ${nick(i.seller)}</div>
 <div class="row" style="margin-top:8px">${i.seller===me||U(me).admin?`<button onclick="itemForm('${i.id}')">✏️</button><button class="d" onclick="delItem('${i.id}')">🗑</button>`:`<button class="p" onclick="buy('${i.id}')">Sotib olish</button><button onclick="chatTo='${i.seller}';tab='chat';render()">Yozish</button>`}</div></div>`;
function listing(game){const f=gameF[game]||'all',l=S.items.filter(i=>i.game===game&&(f==='all'||i.kind===f));
 return `<div class="row">${['all',...Object.keys(KIND)].map(k=>`<button class="${f===k?'on':''}" onclick="gameF['${game}']='${k}';render()">${KIND[k]||'Hammasi'}</button>`).join('')}<span class="sp"></span><button class="p" onclick="itemForm('','${game}')">＋ E'lon yaratish</button></div>
 <h2>${game} e'lonlari</h2><div class="grid">${l.map(itemCard).join('')||'<p class="mu">Hozircha e\'lon yo\'q</p>'}</div>
 <h2>${game} Case lar</h2><div class="grid">${CASES.filter(c=>c[2]===game).map(caseCard).join('')}</div>`}
const caseCard=c=>`<div class="card"><img src="${caseArt(c)}"><b>${c[1]}</b><div class="row"><span class="tag">${c[2]}</span><span class="pr">${c[3]} 🪙</span></div><button class="p" style="width:100%;margin-top:8px" onclick="openCase('${c[0]}')">Ochish</button></div>`;
const V={
 shop(){const u=U(me);return `<h2>Titullar (Coin bilan)</h2><div class="grid">${TITLES.map(([n,p])=>`<div class="card"><div class="ph">🏅</div><b>${n}</b><div class="pr">${p} 🪙</div>${(u.titles||[]).includes(n)?'<button disabled style="width:100%">Sizda bor ✓</button>':`<button class="p" style="width:100%" onclick="buyTitle('${n}',${p})">Sotib olish</button>`}</div>`).join('')}</div>
 <h2>Foydalanuvchilar e'lonlari</h2><input id="sq" placeholder="🔍 Qidirish..." oninput="sq=this.value;$('#sl').innerHTML=sl()" value="${esc(window.sq||'')}"><div class="row"><button class="p" onclick="itemForm('')">＋ Skin / Agent / Pichoq sotish</button></div><div class="grid" id="sl" style="margin-top:10px">${sl()}</div>`},
 cs2:()=>listing('CS2'),so2:()=>listing('SO2'),
 case:()=>`<h2>Barcha Case lar</h2><div class="grid">${CASES.map(caseCard).join('')}</div>`,
 coin(){const u=U(me),can=Date.now()-(u.bonus||0)>864e5;return `<div class="card"><h2 style="margin:0">🪙 ${Math.floor(u.coins||0)} coin</h2><p class="mu">Coin bilan Case oching, titul oling, yutgan skinni sotib coin qaytaring.</p><button class="p" ${can?'':'disabled'} onclick="bonus()">${can?'Kunlik bonus +200':'Bonus olingan (24 soat)'}</button></div><h2>Case ochish</h2><div class="grid">${CASES.map(caseCard).join('')}</div>`},
 inv(){const u=U(me);return `<h2>Skinlar va Case lardan olingan</h2><div class="grid">${(u.inv||[]).map((x,i)=>`<div class="card"><img src="${wArt(x.n,x.k,x.c)}"><b>${esc(x.n)}</b><div class="mu">${x.g} · ${x.r}</div><div class="pr">${x.v} 🪙</div><button style="width:100%;margin-top:6px" onclick="sellInv(${i})">Sotish (${Math.floor(x.v*.8)} 🪙)</button></div>`).join('')||'<p class="mu">Bo\'sh. Case oching!</p>'}</div>
 <h2>Titullar</h2><div class="row">${(u.titles||[]).map(t=>`<button class="${u.title===t?'on':''}" onclick="upd({title:'${t}'})">${t}</button>`).join('')||'<span class="mu">Titul yo\'q</span>'}${u.title?'<button onclick="upd({title:\'\'})">Yechish</button>':''}</div>
 <h2>Mening e'lonlarim</h2><div class="grid">${S.items.filter(i=>i.seller===me).map(itemCard).join('')||'<p class="mu">Yo\'q</p>'}</div>`},
 chat(){const peers=[...new Set(S.chat.filter(m=>m.to!=='all'&&(m.from===me||m.to===me)).map(m=>m.from===me?m.to:m.from).concat(chatTo!=='all'?[chatTo]:[]))];
  return `<div class="row"><select id="ct" style="width:auto" onchange="chatTo=this.value;render()"><option value="all">🌐 Umumiy chat</option>${peers.map(p=>`<option value="${p}" ${chatTo===p?'selected':''}>${esc(U(p).nick||p)}</option>`).join('')}</select></div><div class="msgs" id="cm"></div>
  <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="ci" placeholder="Xabar..." onkeydown="if(event.key==='Enter')send()"><button class="p" onclick="send()">➤</button></div>`},
 report(){const u=U(me),l=S.reports.filter(r=>u.admin||r.from===me);return `<h2>Adminga murojaat</h2><textarea id="rt" rows="3" placeholder="Muammo yoki savolingiz..."></textarea><button class="p" onclick="sendRep()">Yuborish</button>
  <h2>${u.admin?'Barcha murojaatlar':'Murojaatlarim'}</h2>${l.map(r=>`<div class="card" style="margin-bottom:8px"><div class="t">${nick(r.from)} · ${ago(r.t)}</div><p>${esc(r.text)}</p>${r.reply?`<p style="color:var(--ok)">Admin: ${esc(r.reply)}</p>`:u.admin?`<input id="rr${r.id}" placeholder="Javob..."><button onclick="replyRep('${r.id}')">Javob berish</button>`:'<span class="mu">Javob kutilmoqda...</span>'}</div>`).join('')||'<p class="mu">Yo\'q</p>'}`},
 admin(){if(!U(me).admin)return '<p>Ruxsat yo\'q</p>';const us=Object.entries(S.users),rp=S.reports.slice().reverse();return `<h2>🛡 Admin panel</h2><div class="row"><span class="tag">Profillar: ${us.length}</span><span class="tag">E'lonlar: ${S.items.length}</span><span class="tag">Report: ${rp.filter(r=>!r.reply).length} javobsiz</span><span class="sp"></span><button class="p" onclick="aMsg('*')">📢 Hammaga xabar</button></div>
 <h2>Profillar</h2><div class="grid">${us.map(([k,u])=>`<div class="card"><div class="row">${avt(k)}<div><b>${nick(k)}</b>${u.admin?' <span class="tag" style="background:var(--ac);color:#fff">ADMIN</span>':''}<div class="mu">@${k}</div><div class="mu">${esc(u.email)}</div></div></div><p class="pr">🪙 ${Math.floor(u.coins||0)} <span class="mu">· inv: ${(u.inv||[]).length}</span></p><div class="row"><button onclick="aMsg('${k}')">✉️</button><button onclick="aCoin('${k}',1)">➕🪙</button><button onclick="aCoin('${k}',-1)">➖🪙</button></div><button style="width:100%;margin-top:8px" onclick="aRole('${k}')">${u.admin?'👑 Adminlikni olish':'👑 Admin qilish'}</button></div>`).join('')}</div>
 <h2>🖼 Case rasmlari</h2><div class="grid">${CASES.map(c=>imgCard(c[0],c[1],caseArt(c))).join('')}</div>
 <h2>🔫 Qurol / skin rasmlari</h2><div class="grid">${Object.entries(POOL).flatMap(([g,a])=>a.map((n,i)=>imgCard(wk(g,i),g+' · '+n,wArt(n,i===4?'knife':'skin','#4f8cff')))).join('')}</div>
 <h2>Reportlar</h2>${rp.map(r=>`<div class="card" style="margin-bottom:8px"><div class="t">${nick(r.from)} · ${ago(r.t)}</div><p>${esc(r.text)}</p>${r.reply?`<p style="color:var(--ok)">Javob: ${esc(r.reply)}</p>`:`<input id="rr${r.id}" placeholder="Javob..."><button class="p" onclick="replyRep('${r.id}')">Javob berish</button>`}</div>`).join('')||'<p class="mu">Report yo\'q</p>'}`},
 notif(){setTimeout(()=>S.notifs.filter(n=>n.to===me&&!n.r).forEach(n=>db.doc('notifs/'+n.id).update({r:1})),1500);return `<h2>Uvedomleniyalar</h2>${S.notifs.filter(n=>n.to===me).map(n=>`<div class="card" style="margin-bottom:8px;${n.r?'':'border-color:var(--ac)'}">${esc(n.text)}<div class="mu">${ago(n.t)}</div></div>`).join('')||'<p class="mu">Xabar yo\'q</p>'}`},
 me(){const u=U(me);return `<div class="card"><div class="row">${avt(me).replace('44px','44px')}<div><b>${nick(me)}</b><div class="mu">@${me} · ${esc(u.email)}</div></div></div>
  <h2>Profilni tahrirlash</h2><label class="mu">Nik</label><input id="pn" value="${esc(u.nick)}" maxlength="24"><label class="mu">Bio</label><textarea id="pb" rows="3">${esc(u.bio)}</textarea><label class="mu">Rasm</label><input type="file" id="pf" accept="image/*">
  <div class="row"><button class="p" onclick="saveProf()">Saqlash</button><button class="d" onclick="logout()">Chiqish</button></div></div>`}
};
let sq='';function sl(){const q=sq.toLowerCase();return S.items.filter(i=>!q||(i.name+i.bio).toLowerCase().includes(q)).map(itemCard).join('')||'<p class="mu">E\'lon yo\'q</p>'}
function img(file,w=260,ty='image/jpeg'){return new Promise(r=>{if(!file)return r('');const i=new Image;i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL(ty,ty==='image/jpeg'?.7:.85))};i.onerror=()=>r('');i.src=URL.createObjectURL(file)})}
async function saveProf(){const av=await img($('#pf').files[0],160);const d={nick:$('#pn').value.trim()||me,bio:$('#pb').value};if(av)d.av=av;await upd(d);toast('Saqlandi')}
function itemForm(id,game){const i=S.items.find(x=>x.id===id)||{game:game||'CS2',kind:'skin',name:'',price:'',bio:''};
 modal(`<h2 style="margin-top:0">${id?'Tahrirlash':'Yangi e\'lon'}</h2><select id="fg"><option ${i.game==='CS2'?'selected':''}>CS2</option><option ${i.game==='SO2'?'selected':''}>SO2</option></select>
 <select id="fk">${Object.entries(KIND).map(([k,n])=>`<option value="${k}" ${i.kind===k?'selected':''}>${n}</option>`).join('')}</select>
 <input id="fn" placeholder="Nomi / Ismi" value="${esc(i.name)}"><input id="fp" type="number" placeholder="Narxi (coin)" value="${esc(i.price)}"><textarea id="fb" rows="3" placeholder="Bio / tavsif">${esc(i.bio)}</textarea>
 <label class="mu">Rasm</label><input type="file" id="ff" accept="image/*"><div class="row"><button class="p" onclick="saveItem('${id}')">Saqlash</button><button onclick="closeM()">Bekor</button></div>`)}
async function saveItem(id){const o=S.items.find(x=>x.id===id),im=await img($('#ff').files[0]);const d={game:$('#fg').value,kind:$('#fk').value,name:$('#fn').value.trim(),price:+$('#fp').value,bio:$('#fb').value,img:im||o?.img||'',seller:o?.seller||me,t:o?.t||Date.now()};
 if(!d.name||!(d.price>=0))return toast('Nom va narxni kiriting');id?await db.doc('items/'+id).set(d):await db.collection('items').add(d);closeM()}
function delItem(id){ask('E\'lon o\'chirilsinmi?',()=>db.doc('items/'+id).delete().then(()=>toast('O\'chirildi')))}
function buy(id){const i=S.items.find(x=>x.id===id);modal(`<h2 style="margin-top:0">${esc(i.name)} — ${esc(i.price)} 🪙</h2><p class="mu">Sotuvchi siz bilan bog'lanishi uchun akkauntingizni kiriting:</p><select id="bp"><option>Telegram</option><option>Discord</option><option>Instagram</option></select><input id="ba" placeholder="@username"><div class="row"><button class="p" onclick="doBuy('${id}')">Tasdiqlash</button><button onclick="closeM()">Bekor</button></div>`)}
async function doBuy(id){const i=S.items.find(x=>x.id===id),a=$('#ba').value.trim();if(!a)return toast('Akkaunt kiriting');
 await notify(i.seller,`🛒 ${U(me).nick||me} "${i.name}" ni sotib olmoqchi. ${$('#bp').value}: ${a}`);await notify(me,`✅ "${i.name}" so'rovi yuborildi. Sotuvchi ${a} orqali bog'lanadi.`);closeM();toast('So\'rov yuborildi!')}
async function buyTitle(n,p){const u=U(me);if(u.coins<p)return toast('Coin yetmaydi');await upd({coins:u.coins-p,titles:[...(u.titles||[]),n],title:n});await notify(me,`🏅 "${n}" titulini oldingiz!`)}
async function bonus(){await upd({coins:U(me).coins+200,bonus:Date.now()})}
async function openCase(id){const c=CASES.find(x=>x[0]===id),u=U(me);if(u.coins<c[3])return toast('Coin yetmaydi');
 let r=Math.random()*100,k=0;for(;k<4;k++){if((r-=RAR[k][1])<0)break}const cl=['#9aa','#4f8cff','#a855f7','#ec4899','#facc15'][k],it={n:POOL[c[2]][k],r:RAR[k][0],v:Math.round(c[3]*RAR[k][2]),g:c[2],e:IC.skin,c:cl,k:k===4?'knife':'skin'};
 await upd({coins:u.coins-c[3],inv:[...(u.inv||[]),it]});modal(`<div style="text-align:center"><img src="${wArt(it.n,it.k,cl)}" style="height:110px"><h2>${esc(it.n)}</h2><p style="color:${cl}">${it.r} · ${it.v} 🪙</p><button class="p" onclick="closeM()">Yaxshi!</button></div>`)}
async function sellInv(i){const u=U(me),x=u.inv[i],inv=u.inv.filter((_,j)=>j!==i);await upd({inv,coins:u.coins+Math.floor(x.v*.8)})}
function chatMsgs(){const el=$('#cm');if(!el)return;const l=S.chat.filter(m=>chatTo==='all'?m.to==='all':(m.from===me&&m.to===chatTo)||(m.from===chatTo&&m.to===me));
 el.innerHTML=l.map(m=>`<div class="m ${m.from===me?'me':''}"><div class="t" style="${m.from===me?'color:#fff9':''}">${nick(m.from)}</div>${esc(m.text)}</div>`).join('')||'<span class="mu">Xabar yo\'q</span>';el.scrollTop=1e9}
async function send(){const i=$('#ci'),t=i.value.trim();if(!t)return;i.value='';await db.collection('chat').add({from:me,to:chatTo,text:t,t:Date.now()});if(chatTo!=='all')notify(chatTo,`💬 ${U(me).nick||me}: ${t.slice(0,60)}`)}
async function sendRep(){const t=$('#rt').value.trim();if(!t)return;await db.collection('reports').add({from:me,text:t,t:Date.now(),reply:''});toast('Yuborildi')}
async function replyRep(id){const r=S.reports.find(x=>x.id===id),t=$('#rr'+id).value.trim();if(!t)return;await db.doc('reports/'+id).update({reply:t});await notify(r.from,`🛟 Admin javobi: ${t}`)}
function aMsg(u){modal(`<h2 style="margin-top:0">Xabar: ${u==='*'?'hammaga':esc(u)}</h2><textarea id="am" rows="3" placeholder="Xabar matni"></textarea><div class="row"><button class="p" onclick="aSend('${u}')">Yuborish</button><button onclick="closeM()">Bekor</button></div>`)}
async function aSend(u){const t=$('#am').value.trim();if(!t)return toast('Matn yozing');const to=u==='*'?Object.keys(S.users):[u];for(const x of to)await notify(x,'📢 Admin: '+t);closeM();toast('Yuborildi')}
function aCoin(u,s){modal(`<h2 style="margin-top:0">${s>0?'Coin qo\'shish':'Coin ayirish'}: ${esc(u)}</h2><input id="ac" type="number" min="1" placeholder="Miqdor"><div class="row"><button class="p" onclick="aDo('${u}',${s})">Tasdiqlash</button><button onclick="closeM()">Bekor</button></div>`)}
async function aDo(u,s){const n=+$('#ac').value;if(!(n>0))return toast('Miqdor kiriting');await db.doc('users/'+u).update({coins:Math.max(0,(U(u).coins||0)+s*n)});await notify(u,`🪙 Admin sizga ${n} coin ${s>0?'qo\'shdi':'ayirdi'}.`);closeM();toast('Bajarildi')}
const wk=(g,i)=>g+'_'+i,WK={};for(const g in POOL)POOL[g].forEach((n,i)=>WK[n]=wk(g,i));
function wArt(n,k,c){const key=WK[n];return (key&&S.cfg[key])||art(k||'skin',c)}
function imgCard(key,label,src){return `<div class="card"><img src="${src}"><b>${esc(label)}</b><input type="file" accept="image/*" onchange="setImg('${key}',this)">${S.cfg[key]?`<button class="d" onclick="resetImg('${key}')">Asl holatiga</button>`:''}</div>`}
async function setImg(k,el){const f=el.files[0];el.blur();if(!f)return;const d=await img(f,360,'image/webp');if(!d)return toast('Rasm o\'qilmadi');await db.doc('cfg/'+k).set({img:d});toast('Rasm qo\'yildi')}
async function resetImg(k){await db.doc('cfg/'+k).delete();toast('Asl holatiga qaytdi')}
function aRole(k){if(k===me)return toast('O\'zingizning huquqingizni o\'zgartira olmaysiz');const on=!U(k).admin;ask(`${esc(U(k).nick||k)} ${on?'admin qilinsinmi?':'adminlikdan olinsinmi?'}`,async()=>{await db.doc('users/'+k).update(on?{admin:true}:{admin:false,title:U(k).title==='Admin'?'':U(k).title||''});await notify(k,on?'👑 Siz Admin qilindingiz!':'Admin huquqingiz olib tashlandi.');toast('Bajarildi')})}
boot();
</script></body></html>
